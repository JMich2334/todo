<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBFAF9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="To-Do's" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="icon" href="/icon.png" />
<link rel="manifest" href="/manifest.json" />
<title>To-Do's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#FBFAF9;color:#1A1A18;font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:620px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
:focus-visible{outline:2px solid #8E8CE8;outline-offset:2px;border-radius:6px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-family:'Instrument Serif',Georgia,serif;font-size:38px;font-weight:400;letter-spacing:-.01em;margin:0}
.count{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#9A9891;font-weight:500;text-align:right;line-height:1.6}
.count b{display:block;color:#1A1A18;font-weight:700;letter-spacing:.06em}
.composer{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid #EFEDE9;border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 1px 3px rgba(26,26,24,.04)}
#tin{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;color:#1A1A18;padding:8px 0}
#tin::placeholder{color:#B4B1AA}
#plus{width:36px;height:36px;border-radius:12px;background:#1A1A18;color:#fff;font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#plus:disabled{background:#E4E2DD;color:#B4B1AA}
.picker{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0 6px}
.picker.last{margin-bottom:26px}
.pchip{border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:500;background:#fff;border:1px solid #EFEDE9;color:#8A8880;display:flex;align-items:center;gap:5px}
.pchip .m{font-size:9px}
.pchip.on{border-color:transparent}
.pchip.time.on{background:#1A1A18;color:#fff}
.group{margin-bottom:22px}
.ghead{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.ghead .m{font-size:9px}
.ghead .tot{font-weight:500;opacity:.75}
.chev{font-size:10px;opacity:.6;display:inline-block;transition:transform .2s ease}
.chev.up{transform:rotate(180deg)}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #F1EFEB;border-radius:16px;padding:13px 15px;margin-bottom:8px;box-shadow:0 1px 2px rgba(26,26,24,.035)}
.bubble{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.mid{flex:1;min-width:0}
.txt{font-size:15.5px;font-weight:500;line-height:1.35;word-break:break-word}
.time{margin-top:4px;font-size:11.5px;font-weight:500;color:#9A9891}
.item.done{background:#F7F6F4;box-shadow:none}
.item.done .txt{text-decoration:line-through;color:#B4B1AA}
.circle{width:23px;height:23px;border-radius:50%;border:1.8px solid #DAD7D1;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.circle.on{background:#1A1A18;border-color:#1A1A18}
.del{font-size:16px;color:#D6D3CD;padding:0 3px}
.empty{text-align:center;padding:44px 20px;color:#A9A69F}
.empty .big{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:22px;color:#8A8880;margin-bottom:6px}
.evwrap{margin-bottom:26px}
.evhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.evadd{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#5B6BC0}
.evform{display:none;gap:8px;flex-wrap:wrap;align-items:center;background:#F3F1ED;border:1px solid #EFEDE9;border-radius:14px;padding:11px;margin-bottom:10px}
.evform.open{display:flex}
#evname{flex:1 1 100%;border:1px solid #EFEDE9;border-radius:10px;padding:10px;font-family:inherit;font-size:15px;background:#fff;color:#1A1A18;outline:none}
#evdate{flex:1;border:1px solid #EFEDE9;background:#fff;border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px;color:#1A1A18;min-height:40px}
#evsave{background:#1A1A18;color:#fff;border-radius:10px;padding:11px 18px;font-size:13px;font-weight:600}
#evsave:disabled{background:#D9D6D0}
.evlist{background:#fff;border:1px solid #F1EFEB;border-radius:16px;padding:2px 0;box-shadow:0 1px 2px rgba(26,26,24,.035)}
.evrow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.evrow+.evrow{border-top:1px solid #F4F2EE}
.evdate{min-width:46px;text-align:center;flex-shrink:0}
.evmon{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#9A9891}
.evday{display:block;font-family:'Instrument Serif',Georgia,serif;font-size:24px;line-height:1.05;color:#1A1A18}
.evmid{flex:1;min-width:0}
.evname{font-size:15px;font-weight:500;line-height:1.3;word-break:break-word}
.evcount{font-size:11.5px;color:#9A9891;margin-top:2px}
.evcount.soon{color:#D14343;font-weight:600}
.evdel{font-size:16px;color:#D6D3CD;padding:0 3px;flex-shrink:0}
.evempty{font-size:13px;color:#A9A69F;padding:14px 2px}
.metarow{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.time{margin-top:0}
.tbtn{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#B4B1AA;border:1px solid #EFEDE9;border-radius:999px;padding:3px 9px;background:#fff}
.tbtn.on{background:#1A1A18;color:#fff;border-color:#1A1A18}
.todaywrap{margin-bottom:24px}
.thead{display:inline-flex;align-items:center;gap:8px;background:#1A1A18;color:#F7F8F5;border-radius:999px;padding:7px 15px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:11px}
.thead .tot{font-weight:500;opacity:.7}
.chal{background:#fff;border:1px solid #F1EFEB;border-radius:16px;padding:14px;margin-bottom:26px;box-shadow:0 1px 2px rgba(26,26,24,.035)}
.chalhead{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.chaltitle{font-family:'Instrument Serif',Georgia,serif;font-size:21px;line-height:1.1}
.chalday{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:#9A9891;margin-top:3px}
.chalday b{color:#1A1A18}
.chalring{text-align:right;flex-shrink:0}
.chalscore{font-family:'Instrument Serif',Georgia,serif;font-size:26px;line-height:1}
.chalscore span{font-size:15px;color:#B4B1AA}
.chalstreak{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#C4802B}
.chalbody{margin-top:14px}
.chalbody.hide{display:none}
.hab{display:flex;align-items:center;gap:11px;padding:9px 2px}
.hab+.hab{border-top:1px solid #F4F2EE}
.habbox{width:22px;height:22px;border-radius:7px;border:1.8px solid #DAD7D1;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.habbox.on{background:#1A1A18;border-color:#1A1A18}
.habemo{font-size:15px;flex-shrink:0;width:20px;text-align:center}
.habname{flex:1;font-size:14.5px;font-weight:500;line-height:1.3}
.hab.done .habname{color:#B4B1AA;text-decoration:line-through}
.winsbtn{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B6BC0;flex-shrink:0}
.winsbox{padding:4px 2px 10px}
.winrow{display:flex;align-items:center;gap:8px;margin-top:7px}
.winnum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:#B4B1AA;width:12px;flex-shrink:0}
.wininput{flex:1;border:none;border-bottom:1px solid #EFEDE9;background:transparent;font-family:inherit;font-size:14px;color:#1A1A18;padding:5px 0;outline:none}
.wininput:focus{border-bottom-color:#1A1A18}
.grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:15px;padding-top:14px;border-top:1px solid #F4F2EE}
.dot{width:calc((100% - 36px)/10);aspect-ratio:1;border-radius:3px;background:#F1EFEB}
.dot.part{background:#E4D9C4}
.dot.full{background:#1A1A18}
.dot.miss{background:#F7DCDC}
.dot.today{outline:1.5px solid #1A1A18;outline-offset:1px}
.chalfoot{display:flex;justify-content:space-between;align-items:center;margin-top:11px}
.challegend{font-size:10.5px;color:#B4B1AA}
.chalreset{font-size:10.5px;color:#D6D3CD;text-decoration:underline}
.rbadge{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B6BC0;background:#E9EDFA;border-radius:999px;padding:3px 8px}
.tempty{border:1px dashed #DEDBD4;border-radius:14px;padding:15px;font-size:13px;color:#A9A69F;line-height:1.45}
.txt,.evname{cursor:text}
.editbox{background:#fff;border:1.5px solid #C9C6BF;border-radius:16px;padding:12px;margin-bottom:8px}
.einput{width:100%;border:1px solid #EFEDE9;border-radius:10px;padding:10px;font-family:inherit;font-size:15.5px;color:#1A1A18;background:#FBFAF9;outline:none;margin-bottom:9px}
.echips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px}
.eacts{display:flex;gap:8px;justify-content:flex-end}
.ebtn{border-radius:10px;padding:9px 16px;font-size:13px;font-weight:600}
.ebtn.save{background:#1A1A18;color:#fff}
.ebtn.cancel{color:#8A8880}
.ehint{font-size:11px;color:#A9A69F;margin-bottom:9px}
.todayhead{display:flex;align-items:baseline;justify-content:space-between;margin:0 0 10px}
.todaytot{font-size:11.5px;font-weight:600;letter-spacing:.04em;color:#9A9891}
.todaytot.over{color:#D14343}
.todaywrap{margin-bottom:24px}
.item.today{border-color:#E8DCC4;box-shadow:0 1px 2px rgba(196,128,43,.10)}
.todayempty{border:1px dashed #E4E2DD;border-radius:14px;padding:16px 14px;font-size:13px;color:#A9A69F;text-align:center}
.ebtn.del{color:#D14343;margin-right:auto}
.upcoming{background:#fff;border:1px solid #F1EFEB;border-radius:16px;padding:6px 4px;margin-bottom:26px;box-shadow:0 1px 2px rgba(26,26,24,.035)}
.uprow{display:flex;align-items:center;gap:10px;padding:9px 12px}
.uprow+.uprow{border-top:1px solid #F4F2EE}
.upwhen{font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#9A9891;min-width:82px;flex-shrink:0}
.upwhen.hot{color:#D14343}
.uptxt{font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sechead{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A9A69F;margin:0 0 10px}
.donehead{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#A9A69F;margin:26px 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1>To-Do's</h1>
    <span class="count"><b id="total">0m</b><span id="left">0 left</span></span>
  </div>
  <div class="evwrap">
    <div class="evhead">
      <span class="sechead" style="margin:0">Upcoming</span>
      <button class="evadd" id="evtoggle">+ Add date</button>
    </div>
    <div class="evform" id="evform">
      <input id="evname" placeholder="What is it?" autocomplete="off" />
      <input type="date" id="evdate" />
      <button id="evsave" disabled>Save</button>
    </div>
    <div id="evlist"></div>
  </div>
  <div class="composer">
    <input id="tin" placeholder="Add a task" autocomplete="off" />
    <button id="plus" disabled aria-label="Add task">+</button>
  </div>
  <div class="picker" id="levelPicker"></div>
  <div class="picker" id="timePicker"></div>
  <div class="picker last" id="repeatPicker"></div>
  <div id="chalwrap"></div>
  <div class="todaywrap" id="todaywrap"></div>
  <div id="list"></div>
</div>

<script>
var KEY = "todos-v3";
var LEVELS = [
  { id:"high", label:"High",   mark:"\u25B2", pill:"#FCE9EA", text:"#D14343" },
  { id:"med",  label:"Medium", mark:"\u25CF", pill:"#FBEEDF", text:"#C4802B" },
  { id:"low",  label:"Low",    mark:"\u25BC", pill:"#E9EDFA", text:"#5B6BC0" }
];
var TIMES = [15, 30, 60, 120, 240, 480];
var REPEATS = [
  { id:"once",     label:"Once" },
  { id:"daily",    label:"Daily" },
  { id:"weekdays", label:"Weekdays" }
];
var repeat = "once";
var editRep = "once";

function todayStr(){
  var d = new Date();
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function isRecurring(t){ return t.repeat === "daily" || t.repeat === "weekdays"; }
function activeToday(t){
  if(t.repeat === "weekdays"){ var w = new Date().getDay(); return w >= 1 && w <= 5; }
  return true;
}
function isDone(t){ return isRecurring(t) ? t.doneOn === todayStr() : !!t.done; }
var ICONS = [
  [/bill|pay|invoice|rent/i,"\uD83D\uDCB8","#FEF3C7"],
  [/budget|money|finance|bank/i,"\uD83D\uDCB0","#FDE8D7"],
  [/doctor|appointment|dentist|health|clinic/i,"\uD83E\uDE7A","#DDF1F7"],
  [/resume|cv|cover letter/i,"\uD83D\uDCC4","#E7E4FA"],
  [/interview|screen|recruiter|apply/i,"\uD83C\uDFAF","#FCE0E4"],
  [/meeting|brainstorm|standup|sync/i,"\uD83E\uDDE0","#FBDDE6"],
  [/call|phone|mom|dad|ring/i,"\uD83D\uDCDE","#E3F5DE"],
  [/email|send|reply|follow.?up|outreach/i,"\u2709\uFE0F","#E4EEFB"],
  [/laundry|fold|clean|dishes|tidy/i,"\uD83E\uDDFA","#EAF0DC"],
  [/grocer|shop|store|buy|order/i,"\uD83D\uDED2","#FDE7DC"],
  [/gym|run|workout|walk|train/i,"\uD83C\uDFCB\uFE0F","#DFF0EC"],
  [/code|deploy|bug|build|app|ship/i,"\uD83D\uDCBB","#E5E7F5"],
  [/read|study|learn|course/i,"\uD83D\uDCD6","#F2E7DA"],
  [/car|drive|gas|oil/i,"\uD83D\uDE97","#E6ECF3"],
  [/gift|birthday|card/i,"\uD83C\uDF81","#FBE1EC"],
  [/trip|flight|travel|hotel/i,"\u2708\uFE0F","#DEEDF7"],
  [/water|plant|garden/i,"\uD83E\uDEB4","#E2F1DC"],
  [/eat|lunch|dinner|cook|meal/i,"\uD83C\uDF7D\uFE0F","#FBE9D8"],
  [/write|draft|post|note/i,"\u270D\uFE0F","#EDE6F7"],
  [/pack|move|box/i,"\uD83D\uDCE6","#F0E9DE"]
];

var EKEY = "events-v1";
var events = [];
var tasks = [];
var level = "high";
var minutes = 30;
var collapsed = {};
var editing = null, editText = "", editLevel = "high", editMin = 30;
var editingEv = null, evText = "", evDate = "";

try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { tasks = []; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch(e){} }
try { events = JSON.parse(localStorage.getItem(EKEY)) || []; } catch (e) { events = []; }
function saveEvents(){ try { localStorage.setItem(EKEY, JSON.stringify(events)); } catch(e){} }

function countdown(due){
  var d = dayDiff(due);
  if(d === 0) return { t:"Today", soon:true };
  if(d === 1) return { t:"Tomorrow", soon:true };
  if(d < 0)   return { t:"Passed", soon:false };
  if(d < 7)   return { t:"in "+d+" days", soon:true };
  if(d < 14)  return { t:"next week", soon:false };
  return { t:"in "+d+" days", soon:false };
}

function renderEvents(){
  var live = events
    .filter(function(e){ return dayDiff(e.due) >= 0; })
    .sort(function(a,b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });

  if(!live.length){
    document.getElementById("evlist").innerHTML =
      '<div class="evempty">No dates yet \u2014 concerts, appointments, deadlines, trips.</div>';
    return;
  }

  var html = '<div class="evlist">';
  live.forEach(function(e){
    var p = e.due.split("-");
    var dt = new Date(+p[0], +p[1]-1, +p[2]);
    var c = countdown(e.due);
    if(editingEv === e.id){
      html += '<div class="evrow" style="display:block"><input class="einput" id="eEvName" value="'+esc(evText)+'" />'+
        '<input class="einput" type="date" id="eEvDate" value="'+evDate+'" />'+
        '<div class="eacts"><button class="ebtn cancel" data-act="evcancel">Cancel</button>'+
        '<button class="ebtn save" data-act="evsave2" data-id="'+e.id+'">Save</button></div></div>';
      return;
    }
    html += '<div class="evrow">'+
      '<span class="evdate"><span class="evmon">'+dt.toLocaleDateString(undefined,{month:"short"})+'</span>'+
      '<span class="evday">'+dt.getDate()+'</span></span>'+
      '<span class="evmid"><span class="evname" data-act="evedit" data-id="'+e.id+'">'+esc(e.name)+'</span>'+
      '<span class="evcount'+(c.soon?" soon":"")+'">'+c.t+'</span></span>'+
      '<button class="evdel" data-act="evdel" data-id="'+e.id+'" aria-label="Delete date">\u00D7</button></div>';
  });
  document.getElementById("evlist").innerHTML = html + '</div>';
}

function fmt(m){ if(m<60) return m+"m"; var h=Math.floor(m/60), r=m%60; return r? h+"h "+r+"m" : h+"h"; }
function iconFor(t){ for(var i=0;i<ICONS.length;i++){ if(ICONS[i][0].test(t)) return {e:ICONS[i][1],bg:ICONS[i][2]}; } return {e:"\uD83D\uDCCC",bg:"#EEEDEA"}; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function dayDiff(due){
  var p = due.split("-");
  var a = new Date(+p[0], +p[1]-1, +p[2]);
  var n = new Date();
  return Math.round((a - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000);
}
function dateLabel(due){
  var d = dayDiff(due);
  var p = due.split("-");
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  if(d < 0)  return { t: (-d===1? "1 day late" : (-d)+" days late"), hot:true };
  if(d === 0) return { t:"Today", hot:true };
  if(d === 1) return { t:"Tomorrow", hot:true };
  if(d < 7)  return { t: dt.toLocaleDateString(undefined,{weekday:"long"}), hot:false };
  return { t: dt.toLocaleDateString(undefined,{month:"short",day:"numeric"}), hot:false };
}
function levelById(id){ for(var i=0;i<LEVELS.length;i++) if(LEVELS[i].id===id) return LEVELS[i]; return LEVELS[0]; }

function rowHTML(t){
  if(editing === t.id){
    var chips = LEVELS.map(function(l){
      var on = editLevel===l.id;
      return '<button class="pchip'+(on?" on":"")+'" data-act="elvl" data-lvl="'+l.id+'"'+
        (on?' style="background:'+l.pill+';color:'+l.text+'"':'')+'><span class="m">'+l.mark+'</span>'+l.label+'</button>';
    }).join("");
    var tchips = TIMES.map(function(m){
      return '<button class="pchip time'+(editMin===m?" on":"")+'" data-act="emin" data-min="'+m+'">'+fmt(m)+'</button>';
    }).join("");
    var rchips = REPEATS.map(function(r){
      return '<button class="pchip time'+(editRep===r.id?" on":"")+'" data-act="erep" data-rep="'+r.id+'">'+
        (r.id==="once" ? r.label : "\u21BB "+r.label)+'</button>';
    }).join("");
    return '<div class="editbox">'+
      '<input class="einput" id="eIn" value="'+esc(editText)+'" />'+
      '<div class="echips">'+chips+'</div>'+
      '<div class="echips">'+tchips+'</div>'+
      '<div class="echips">'+rchips+'</div>'+
      '<div class="eacts"><button class="ebtn del" data-act="del" data-id="'+t.id+'">Delete</button>'+
      '<button class="ebtn cancel" data-act="ecancel">Cancel</button>'+
      '<button class="ebtn save" data-act="esave" data-id="'+t.id+'">Save</button></div></div>';
  }
  var ic = iconFor(t.text);
  var dn = isDone(t);
  var d = (dn ? " done" : "") + ((t.today || isRecurring(t)) && !dn ? " today" : "");
  return '<div class="item'+d+'">'+
    '<span class="bubble" style="background:'+(dn?"#EDEBE7":ic.bg)+'">'+ic.e+'</span>'+
    '<div class="mid"><div class="txt" data-act="edit" data-id="'+t.id+'">'+esc(t.text)+'</div>'+
    '<div class="metarow"><button class="time" data-act="time" data-id="'+t.id+'">\u23F1 '+fmt(t.minutes||30)+'</button>'+
    (isRecurring(t) ? '<span class="rbadge">\u21BB '+(t.repeat==="daily"?"daily":"weekdays")+'</span>' :
      (dn ? '' : '<button class="tbtn'+(t.today?" on":"")+'" data-act="today" data-id="'+t.id+'">'+(t.today?"\u2713 today":"+ today")+'</button>'))+
    '</div></div>'+
    '<button class="del" data-act="del" data-id="'+t.id+'" aria-label="Delete task">\u00D7</button>'+
    '<button class="circle'+(dn?" on":"")+'" data-act="toggle" data-id="'+t.id+'" aria-label="Toggle done">'+(dn?"\u2713":"")+'</button>'+
  '</div>';
}

function render(){
  var visible = tasks.filter(activeToday);
  var openT = visible.filter(function(t){ return !isDone(t); });
  var doneT = visible.filter(isDone);
  var total = openT.reduce(function(s,t){ return s + (t.minutes||0); }, 0);
  document.getElementById("total").textContent = fmt(total);
  document.getElementById("left").textContent = openT.length + " left";

  var rankOf = { high:0, med:1, low:2 };
  var todayT = openT.filter(function(t){ return t.today || isRecurring(t); })
                    .sort(function(a,b){ return rankOf[a.level] - rankOf[b.level]; });
  var restT = openT.filter(function(t){ return !t.today && !isRecurring(t); });
  var todayMin = todayT.reduce(function(s,t){ return s + (t.minutes||0); }, 0);

  var thtml = "";
  if(todayT.length){
    thtml = '<div class="thead">Today ('+todayT.length+')<span class="tot">\u00B7 '+fmt(todayMin)+'</span></div>';
    todayT.forEach(function(t){ thtml += rowHTML(t); });
  } else if(openT.length){
    thtml = '<div class="thead">Today (0)</div><div class="tempty">Tap <b>+ today</b> on any task below to pull it up here.</div>';
  }
  document.getElementById("todaywrap").innerHTML = thtml;

  var html = "";
  if(!tasks.length){
    html = '<div class="empty"><div class="big">Nothing here yet</div><div>Add what matters most first.</div></div>';
  }
  LEVELS.forEach(function(l){
    var g = restT.filter(function(t){ return t.level===l.id; });
    if(!g.length) return;
    var isOpen = !collapsed[l.id];
    var gm = g.reduce(function(s,t){ return s+(t.minutes||0); },0);
    html += '<div class="group"><button class="ghead" data-act="fold" data-lvl="'+l.id+'" style="background:'+l.pill+';color:'+l.text+'">'+
      '<span class="m">'+l.mark+'</span>'+l.label+' ('+g.length+')<span class="tot">\u00B7 '+fmt(gm)+'</span>'+
      '<span class="chev'+(isOpen?" up":"")+'">\u25BE</span></button>';
    if(isOpen) g.forEach(function(t){ html += rowHTML(t); });
    html += '</div>';
  });
  if(doneT.length){
    html += '<div class="donehead">Done ('+doneT.length+')</div>';
    doneT.forEach(function(t){ html += rowHTML(t); });
  }
  document.getElementById("list").innerHTML = html;
}

var CKEY = "challenge-v1";
var HABITS = [
  { id:"push",    emo:"\uD83D\uDCAA", name:"100 pushups" },
  { id:"read",    emo:"\uD83D\uDCD6", name:"Read 10 pages" },
  { id:"cold",    emo:"\uD83D\uDEBF", name:"Cold shower" },
  { id:"journal", emo:"\u270D\uFE0F", name:"Journal" },
  { id:"study",   emo:"\uD83D\uDCDA", name:"Study 1 hour" },
  { id:"sleep",   emo:"\uD83D\uDE34", name:"7 hours of sleep" },
  { id:"clean",   emo:"\uD83D\uDEAB", name:"No alcohol, no smoking" },
  { id:"wins",    emo:"\uD83C\uDFC6", name:"5 daily wins" }
];
var DAYS = 60;
var chal = { start:null, log:{} };
var chalOpen = true, winsOpen = false;

try { chal = JSON.parse(localStorage.getItem(CKEY)) || chal; } catch(e){}
if(!chal.start) chal.start = todayStr();
if(!chal.log) chal.log = {};
function saveChal(){ try { localStorage.setItem(CKEY, JSON.stringify(chal)); } catch(e){} }

function dayIndex(){ return -dayDiff(chal.start); }        // 0-based days since start
function dateForIndex(i){
  var p = chal.start.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2] + i);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function entry(ds){ return chal.log[ds] || {}; }
function scoreFor(ds){
  var e = entry(ds), n = 0;
  HABITS.forEach(function(h){ if(e[h.id]) n++; });
  return n;
}
function streak(){
  var n = 0, i = dayIndex();
  for(; i >= 0; i--){
    if(scoreFor(dateForIndex(i)) === HABITS.length) n++;
    else if(i !== dayIndex()) break;
    else continue;                                          // today still in progress
  }
  return n;
}

function renderChal(){
  var idx = dayIndex();
  var ds  = todayStr();
  var e   = entry(ds);
  var score = scoreFor(ds);
  var st = streak();

  var h = '<div class="chal"><div class="chalhead" data-act="chalfold">'+
    '<div><div class="chaltitle">60-Day Challenge</div>'+
    '<div class="chalday">Day <b>'+Math.min(idx+1, DAYS)+'</b> of '+DAYS+'</div></div>'+
    '<div class="chalring"><div class="chalscore">'+score+'<span>/'+HABITS.length+'</span></div>'+
    (st > 1 ? '<div class="chalstreak">'+st+' day streak</div>' : '')+'</div></div>'+
    '<div class="chalbody'+(chalOpen?"":" hide")+'">';

  HABITS.forEach(function(hb){
    var on = !!e[hb.id];
    h += '<div class="hab'+(on?" done":"")+'">'+
      '<button class="habbox'+(on?" on":"")+'" data-act="hab" data-h="'+hb.id+'" aria-label="'+hb.name+'">'+(on?"\u2713":"")+'</button>'+
      '<span class="habemo">'+hb.emo+'</span>'+
      '<span class="habname">'+hb.name+'</span>'+
      (hb.id==="wins" ? '<button class="winsbtn" data-act="winsopen">'+(winsOpen?"hide":"log")+'</button>' : '')+
      '</div>';
    if(hb.id==="wins" && winsOpen){
      var w = e.winsList || ["","","","",""];
      h += '<div class="winsbox">';
      for(var i=0;i<5;i++){
        h += '<div class="winrow"><span class="winnum">'+(i+1)+'</span>'+
          '<input class="wininput" data-win="'+i+'" value="'+esc(w[i]||"")+'" placeholder="A win from today" /></div>';
      }
      h += '</div>';
    }
  });

  h += '<div class="grid">';
  for(var i=0;i<DAYS;i++){
    var d2 = dateForIndex(i), sc = scoreFor(d2), cls = "dot";
    if(i > idx) cls += "";
    else if(sc === HABITS.length) cls += " full";
    else if(sc > 0) cls += " part";
    else if(i < idx) cls += " miss";
    if(i === idx) cls += " today";
    h += '<div class="'+cls+'" title="Day '+(i+1)+'"></div>';
  }
  h += '</div><div class="chalfoot"><span class="challegend">\u25A0 all 8 &nbsp; \u25A0 partial &nbsp; \u25A0 missed</span>'+
    '<button class="chalreset" data-act="chalreset">restart</button></div>';

  h += '</div></div>';
  document.getElementById("chalwrap").innerHTML = h;
}

function renderPickers(){
  document.getElementById("levelPicker").innerHTML = LEVELS.map(function(l){
    var on = level===l.id;
    return '<button class="pchip'+(on?" on":"")+'" data-act="lvl" data-lvl="'+l.id+'"'+
      (on?' style="background:'+l.pill+';color:'+l.text+'"':'')+'><span class="m">'+l.mark+'</span>'+l.label+'</button>';
  }).join("");
  document.getElementById("timePicker").innerHTML = TIMES.map(function(m){
    return '<button class="pchip time'+(minutes===m?" on":"")+'" data-act="min" data-min="'+m+'">'+fmt(m)+'</button>';
  }).join("");
  document.getElementById("repeatPicker").innerHTML = REPEATS.map(function(r){
    return '<button class="pchip time'+(repeat===r.id?" on":"")+'" data-act="rep" data-rep="'+r.id+'">'+
      (r.id==="once" ? r.label : "\u21BB "+r.label)+'</button>';
  }).join("");
}

var tin = document.getElementById("tin");
var plus = document.getElementById("plus");
tin.addEventListener("input", function(){ plus.disabled = !tin.value.trim(); });
tin.addEventListener("keydown", function(e){ if(e.key==="Enter") add(); });
plus.addEventListener("click", add);

function add(){
  var v = tin.value.trim();
  if(!v) return;
  tasks.push({ id: Date.now(), text: v, level: level, minutes: minutes,
               repeat: repeat, doneOn: null, done: false });
  tin.value = ""; plus.disabled = true;
  save(); render();
}

function grabEdit(){ var el=document.getElementById("eIn"); if(el) editText = el.value; }

document.getElementById("app").addEventListener("click", function(e){
  var b = e.target.closest("[data-act]"); if(!b) return;
  var act = b.getAttribute("data-act"); if(!act) return;
  var id = Number(b.getAttribute("data-id"));

  if(act==="chalfold"){ chalOpen = !chalOpen; renderChal(); return; }
  if(act==="winsopen"){ winsOpen = !winsOpen; renderChal(); return; }
  if(act==="hab"){
    var hid = b.getAttribute("data-h");
    var ds = todayStr();
    if(!chal.log[ds]) chal.log[ds] = {};
    chal.log[ds][hid] = !chal.log[ds][hid];
    saveChal(); renderChal(); return;
  }
  if(act==="chalreset"){
    if(confirm("Restart the 60-day challenge from today? Your logged history will be cleared.")){
      chal = { start: todayStr(), log:{} };
      saveChal(); renderChal();
    }
    return;
  }
  if(act==="today"){
    tasks.forEach(function(t){ if(t.id===id) t.today = !t.today; });
    save(); render(); return;
  }
  if(act==="edit"){
    var t0 = tasks.filter(function(t){ return t.id===id; })[0];
    if(t0){ editing=id; editText=t0.text; editLevel=t0.level; editMin=t0.minutes||30; editRep=t0.repeat||"once"; render(); }
    return;
  }
  if(act==="elvl"){ grabEdit(); editLevel=b.getAttribute("data-lvl"); render(); return; }
  if(act==="emin"){ grabEdit(); editMin=Number(b.getAttribute("data-min")); render(); return; }
  if(act==="erep"){ grabEdit(); editRep=b.getAttribute("data-rep"); render(); return; }
  if(act==="ecancel"){ editing=null; render(); return; }
  if(act==="esave"){
    grabEdit();
    var v = editText.trim();
    if(v){ tasks.forEach(function(t){
      if(t.id===id){
        t.text=v; t.level=editLevel; t.minutes=editMin;
        if(t.repeat !== editRep){ t.repeat = editRep; t.doneOn = null; t.done = false; }
      }
    }); save(); }
    editing=null; render(); return;
  }
  if(act==="evedit"){
    var e0 = events.filter(function(x){ return x.id===id; })[0];
    if(e0){ editingEv=id; evText=e0.name; evDate=e0.due; renderEvents(); }
    return;
  }
  if(act==="evcancel"){ editingEv=null; renderEvents(); return; }
  if(act==="evsave2"){
    var n = document.getElementById("eEvName"), d = document.getElementById("eEvDate");
    if(n && n.value.trim() && d && d.value){
      events.forEach(function(x){ if(x.id===id){ x.name=n.value.trim(); x.due=d.value; } });
      saveEvents();
    }
    editingEv=null; renderEvents(); return;
  }
  if(act==="toggle"){
    tasks.forEach(function(t){
      if(t.id!==id) return;
      if(isRecurring(t)) t.doneOn = (t.doneOn === todayStr()) ? null : todayStr();
      else t.done = !t.done;
    });
    save(); render();
  }
  else if(act==="del"){ tasks = tasks.filter(function(t){ return t.id!==id; }); save(); render(); }
  else if(act==="time"){ tasks.forEach(function(t){ if(t.id===id){ var i=TIMES.indexOf(t.minutes); t.minutes=TIMES[(i+1)%TIMES.length]; } }); save(); render(); }
  else if(act==="evdel"){ events = events.filter(function(e){ return e.id!==id; }); saveEvents(); renderEvents(); }
  else if(act==="fold"){ var l=b.getAttribute("data-lvl"); collapsed[l]=!collapsed[l]; render(); }
  else if(act==="lvl"){ level=b.getAttribute("data-lvl"); renderPickers(); }
  else if(act==="min"){ minutes=Number(b.getAttribute("data-min")); renderPickers(); }
  else if(act==="rep"){ repeat=b.getAttribute("data-rep"); renderPickers(); }
});

var evname = document.getElementById("evname");
var evdate = document.getElementById("evdate");
var evsave = document.getElementById("evsave");

document.getElementById("evtoggle").addEventListener("click", function(){
  var f = document.getElementById("evform");
  var open = f.classList.toggle("open");
  this.textContent = open ? "Cancel" : "+ Add date";
  if(open) evname.focus();
});
function evCheck(){ evsave.disabled = !(evname.value.trim() && evdate.value); }
evname.addEventListener("input", evCheck);
evdate.addEventListener("change", evCheck);
evname.addEventListener("keydown", function(e){ if(e.key==="Enter" && !evsave.disabled) evsave.click(); });

evsave.addEventListener("click", function(){
  events.push({ id: Date.now(), name: evname.value.trim(), due: evdate.value });
  evname.value = ""; evdate.value = ""; evsave.disabled = true;
  document.getElementById("evform").classList.remove("open");
  document.getElementById("evtoggle").textContent = "+ Add date";
  saveEvents(); renderEvents();
});

document.getElementById("app").addEventListener("input", function(ev){
  var el = ev.target;
  if(!el || !el.classList || !el.classList.contains("wininput")) return;
  var ds = todayStr();
  if(!chal.log[ds]) chal.log[ds] = {};
  var list = chal.log[ds].winsList || ["","","","",""];
  list[Number(el.getAttribute("data-win"))] = el.value;
  chal.log[ds].winsList = list;
  var filled = list.filter(function(x){ return x && x.trim(); }).length;
  chal.log[ds].wins = filled >= 5;
  saveChal();
});

renderChal();
renderPickers();
renderEvents();
render();
</script>
</body>
