<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FBFAF9" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="To-Do's" />
<link rel="apple-touch-icon" href="/icon.png" />
<link rel="icon" href="/icon.png" />
<link rel="manifest" href="/manifest.json" />
<title>To-Do's</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FBFAF9; --surf:#FFFFFF; --surf2:#F7F6F4; --surf3:#F3F1ED;
  --ink:#1A1A18; --ink2:#5C6360; --ink3:#9A9891; --ink4:#B4B1AA;
  --line:#EFEDE9; --hair:#F4F2EE; --edge:#DAD7D1; --edge2:#DFDCD6;
  --accent:#5B6BC0; --accent-bg:#E9EDFA; --accent-ink:#3A4894;
  --danger:#D14343; --focus:#8E8CE8; --good:#3F6B45; --good2:#6F8B72;
  --warn:#C4802B; --part:#E4D9C4; --miss:#F7DCDC;
  --on-accent:#FFFFFF; --on-dark:#F7F8F5;
  --shadow:0 1px 2px rgba(26,26,24,.035); --shadow2:0 1px 3px rgba(26,26,24,.04);
  --pill-hi-bg:#FCE9EA; --pill-hi-ink:#D14343;
  --pill-md-bg:#FBEEDF; --pill-md-ink:#C4802B;
  --pill-lo-bg:#E9EDFA; --pill-lo-ink:#5B6BC0;
  --am-bg:#FDF3D7; --am-ink:#8A6A10; --am-edge:#F2E2B0;
  --pm-bg:#FCE7D6; --pm-ink:#9A5520; --pm-edge:#F3D2B6;
  --ev-bg:#E7E2F5; --ev-ink:#4A3A7A; --ev-edge:#D6CDEE;
  --any-bg:#EEEDEA; --any-ink:#5C6360; --any-edge:#E2E0DB;
  --c4c-bg:#DCEFE6; --c4c-ink:#1F6B4F; --c4c-edge:#C4E2D4;
}
:root[data-theme="dark"]{
  --bg:#141416; --surf:#1D1E21; --surf2:#232427; --surf3:#232427;
  --ink:#ECEAE6; --ink2:#B5B2AC; --ink3:#8E8B85; --ink4:#6E6B66;
  --line:#2B2C30; --hair:#26272B; --edge:#3A3B40; --edge2:#33343A;
  --accent:#8E9BE0; --accent-bg:#252A3F; --accent-ink:#AEB8EC;
  --danger:#E8756F; --focus:#8E8CE8; --good:#7FBE90; --good2:#4E7A58;
  --warn:#D8A44F; --part:#5A4F38; --miss:#4A2C2C;
  --on-accent:#141416; --on-dark:#ECEAE6;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow2:0 1px 3px rgba(0,0,0,.35);
  --pill-hi-bg:#3E2325; --pill-hi-ink:#EE8C86;
  --pill-md-bg:#3A2D1A; --pill-md-ink:#E0AC63;
  --pill-lo-bg:#252A3F; --pill-lo-ink:#9AA6E6;
  --am-bg:#3A3117; --am-ink:#E7C766; --am-edge:#4B3F1D;
  --pm-bg:#3C2A1B; --pm-ink:#E0A171; --pm-edge:#4D3722;
  --ev-bg:#2B2544; --ev-ink:#B3A5E4; --ev-edge:#3A3159;
  --any-bg:#26272B; --any-ink:#A5A29C; --any-edge:#303135;
  --c4c-bg:#1B3A2E; --c4c-ink:#7FCFA8; --c4c-edge:#24503E;
}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#app{max-width:620px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.topright{display:flex;align-items:center;gap:12px}
#themebtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--surf);color:var(--ink3);font-size:14px;line-height:1;flex-shrink:0;display:flex;align-items:center;justify-content:center}
h1{font-family:'Instrument Serif',Georgia,serif;font-size:38px;font-weight:400;letter-spacing:-.01em;margin:0}
.count{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);font-weight:500;text-align:right;line-height:1.6}
.count b{display:block;color:var(--ink);font-weight:700;letter-spacing:.06em}
.c4c{margin-bottom:26px}
.c4chead{display:flex;align-items:center;gap:8px;width:100%;border-radius:999px;padding:7px 14px;background:var(--c4c-bg);border:1px solid var(--c4c-edge);color:var(--c4c-ink);margin-bottom:10px}
.c4cdot{width:7px;height:7px;border-radius:2px;background:var(--c4c-ink);flex-shrink:0;transform:rotate(45deg)}
.c4cname{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.c4cmeta{font-size:11px;font-weight:500;opacity:.75;margin-left:auto}
.c4chead .chev{margin-left:6px}
.c4cempty{font-size:13px;color:var(--ink4);padding:4px 2px 12px;line-height:1.45}
.c4cadd{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px dashed var(--edge2);border-radius:14px;padding:4px 4px 4px 13px;margin-top:2px}
#c4cin{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:14.5px;color:var(--ink);padding:9px 0}
#c4cin::placeholder{color:var(--ink4)}
#c4cplus{width:32px;height:32px;border-radius:10px;background:var(--c4c-bg);color:var(--c4c-ink);font-size:17px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.opt.proj-on{background:var(--c4c-bg);color:var(--c4c-ink);border-color:transparent;font-weight:600}
.pjbadge{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--c4c-bg);color:var(--c4c-ink);border-radius:999px;padding:2px 7px}
.composer{display:flex;gap:8px;align-items:center;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 1px 3px rgba(26,26,24,.04)}
#tin{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:16px;color:var(--ink);padding:8px 0}
#tin::placeholder{color:var(--ink4)}
#plus{width:36px;height:36px;border-radius:12px;background:var(--ink);color:var(--on-accent);font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0}
#plus:disabled{background:var(--edge2);color:var(--ink4)}
.suggbox{background:var(--surf);border:1px solid var(--line);border-radius:14px;margin:8px 0 0;overflow:hidden;box-shadow:var(--shadow2)}
.sugghead{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink4);padding:9px 13px 5px}
.suggrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 13px}
.suggrow+.suggrow{border-top:1px solid var(--hair)}
.suggrow:active{background:var(--surf2)}
.suggemo{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;background:var(--b,var(--surf2))}
:root[data-theme="dark"] .suggemo{background:color-mix(in srgb,var(--b,#888) 26%,var(--surf))}
.suggtxt{flex:1;min-width:0;font-size:14px;font-weight:500;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.suggtxt.done{color:var(--ink4);text-decoration:line-through}
.suggtxt mark{background:var(--pill-md-bg);color:var(--pill-md-ink);border-radius:3px;padding:0 1px}
.suggwhere{font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);flex-shrink:0}
.suggmore,.suggnone{font-size:12px;color:var(--ink4);padding:9px 13px;line-height:1.4}
.item.flash{animation:flash 1.6s ease}
@keyframes flash{0%,55%{background:var(--pill-md-bg);border-color:var(--pill-md-ink)}100%{background:var(--surf);border-color:var(--line)}}
@media (prefers-reduced-motion:reduce){.item.flash{animation:none;outline:2px solid var(--pill-md-ink);outline-offset:2px}}
.opts{display:none;gap:6px;flex-wrap:wrap;margin:9px 0 26px}
.opts.show{display:flex}
.opt{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--ink2);white-space:nowrap}
.opt .k{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink4)}
.opt.set{border-color:var(--edge);color:var(--ink)}
.opt.pri{border-color:transparent}
.optclock{border:1px solid var(--edge);background:var(--surf);border-radius:999px;padding:5px 10px;font-family:inherit;font-size:12.5px;color:var(--ink);min-height:32px}
.group{margin-bottom:22px}
.ghead{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
.ghead .m{font-size:9px}
.ghead .tot{font-weight:500;opacity:.75}
.chev{font-size:10px;opacity:.6;display:inline-block;transition:transform .2s ease}
.chev.up{transform:rotate(180deg)}
.item{display:flex;align-items:center;gap:12px;background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:8px;box-shadow:0 1px 2px rgba(26,26,24,.035)}
.bubble{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;background:var(--b,var(--surf2))}
:root[data-theme="dark"] .bubble{background:color-mix(in srgb,var(--b,#888) 26%,var(--surf))}
.mid{flex:1;min-width:0}
.txt{font-size:15.5px;font-weight:500;line-height:1.35;word-break:break-word}
.time{margin-top:4px;font-size:11.5px;font-weight:500;color:var(--ink3)}
.item.done{background:var(--surf2);box-shadow:none}
.item.done .txt{text-decoration:line-through;color:var(--ink4)}
.circle{width:23px;height:23px;border-radius:50%;border:1.8px solid var(--edge);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--on-accent)}
.circle.on{background:var(--ink);border-color:var(--ink)}
.del{font-size:16px;color:var(--edge2);padding:0 3px}
.empty{text-align:center;padding:44px 20px;color:var(--ink4)}
.empty .big{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-size:22px;color:var(--ink3);margin-bottom:6px}
.evwrap{margin-bottom:26px}
.evhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.evadd{font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--accent)}
.evform{display:none;gap:8px;flex-wrap:wrap;align-items:center;background:var(--surf3);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:10px}
.evform.open{display:flex}
#evname{flex:1 1 100%;border:1px solid var(--line);border-radius:10px;padding:10px;font-family:inherit;font-size:15px;background:var(--surf);color:var(--ink);outline:none}
#evdate{flex:1;border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:9px 11px;font-family:inherit;font-size:14px;color:var(--ink);min-height:40px}
#evsave{background:var(--ink);color:var(--on-accent);border-radius:10px;padding:11px 18px;font-size:13px;font-weight:600}
#evsave:disabled{background:var(--edge2)}
.evlist{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:2px 0;box-shadow:0 1px 2px rgba(26,26,24,.035)}
.evrow{display:flex;align-items:center;gap:12px;padding:12px 14px}
.evrow+.evrow{border-top:1px solid var(--hair)}
.evdate{min-width:46px;text-align:center;flex-shrink:0}
.evmon{display:block;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.evday{display:block;font-family:'Instrument Serif',Georgia,serif;font-size:24px;line-height:1.05;color:var(--ink)}
.evmid{flex:1;min-width:0;display:block}
.evname{display:block;font-size:15px;font-weight:500;line-height:1.3;word-break:break-word}
.evcount{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.evrange{display:block;font-size:11.5px;color:var(--ink3);margin-top:1px}
.evday.rng{font-size:19px}
.evnow{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--on-accent);background:var(--danger);border-radius:999px;padding:2px 7px;margin-left:6px;vertical-align:1px}
.evcount.soon{color:var(--danger);font-weight:600}
.evdel{font-size:16px;color:var(--edge2);padding:0 3px;flex-shrink:0}
.evempty{font-size:13px;color:var(--ink4);padding:14px 2px}
.evmore{display:block;width:100%;text-align:center;padding:11px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border-top:1px solid var(--hair)}
.metarow{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.time{margin-top:0}
.tbtn{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink4);border:1px solid var(--line);border-radius:999px;padding:3px 9px;background:var(--surf)}
.tbtn.on{background:var(--ink);color:var(--on-accent);border-color:var(--ink)}
.todaywrap{margin-bottom:26px}
.thead{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:var(--on-accent);border-radius:999px;padding:7px 15px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:11px}
.thead .tot{font-weight:500;opacity:.7}
.tcap{font-size:11.5px;color:var(--ink4);margin:-4px 0 12px;padding-left:3px}
.rouwrap{margin-bottom:26px}
.rouhead{display:inline-flex;align-items:center;gap:8px;background:var(--accent-bg);color:var(--accent-ink);border-radius:999px;padding:7px 15px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-bottom:11px}
.rouhead .tot{font-weight:500;opacity:.75}
.rouempty{border:1px dashed var(--edge2);border-radius:14px;padding:15px;font-size:13px;color:var(--ink4);line-height:1.45}
.slot{margin-bottom:14px}
.slothead{display:inline-flex;align-items:center;gap:7px;margin:0 0 9px;border-radius:999px;padding:6px 13px 6px 11px;background:var(--slot-bg,var(--any-bg));border:1px solid var(--slot-edge,var(--any-edge));max-width:100%}
.slothead .chev{margin-left:3px;color:var(--slot-ink,var(--any-ink))}
.slotname{font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--slot-ink,var(--any-ink))}
.slotmeta{font-size:11px;color:var(--slot-ink,var(--any-ink));opacity:.72;font-weight:600}
.slotemo{font-size:12px}
.clock{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:500;color:var(--accent);background:var(--accent-bg);border-radius:999px;padding:2px 8px}
#clockin{border:1px solid var(--line);background:var(--surf);border-radius:999px;padding:6px 11px;font-family:inherit;font-size:12.5px;color:var(--ink);min-height:32px}
.chal{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:26px;box-shadow:0 1px 2px rgba(26,26,24,.035)}
.chalhead{display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.chaltitle{font-family:'Instrument Serif',Georgia,serif;font-size:21px;line-height:1.1}
.chalday{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);margin-top:3px}
.chalday b{color:var(--ink)}
.chalring{text-align:right;flex-shrink:0}
.chalscore{font-family:'Instrument Serif',Georgia,serif;font-size:26px;line-height:1}
.chalscore.hit{color:var(--good)}
.chalscore span{font-size:15px;color:var(--ink4)}
.chalstreak{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--warn)}
.chalbody{margin-top:14px}
.chalbody.hide{display:none}
.cathead{display:flex;align-items:baseline;gap:7px;margin:15px 0 4px;padding-top:12px;border-top:1px solid var(--hair)}
.cathead:first-of-type{border-top:none;padding-top:2px;margin-top:8px}
.catname{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.catnote{font-size:10.5px;color:var(--ink4)}
.catok{font-size:10.5px;font-weight:700;color:var(--good);margin-left:auto}
.catmiss{font-size:10.5px;color:var(--ink4);margin-left:auto}
.winbadge{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--good);border-radius:999px;padding:2px 8px;margin-top:4px}
.hab{display:flex;align-items:center;gap:11px;padding:9px 2px}
.hab+.hab{border-top:1px solid var(--hair)}
.habbox{width:22px;height:22px;border-radius:7px;border:1.8px solid var(--edge);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--on-accent)}
.habbox.on{background:var(--ink);border-color:var(--ink)}
.habemo{font-size:15px;flex-shrink:0;width:20px;text-align:center}
.habname{flex:1;font-size:14.5px;font-weight:500;line-height:1.3}
.hab.done .habname{color:var(--ink4);text-decoration:line-through}
.winsbtn{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);flex-shrink:0}
.winsbox{padding:4px 2px 10px}
.winrow{display:flex;align-items:center;gap:8px;margin-top:7px}
.winnum{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink4);width:12px;flex-shrink:0}
.wininput{flex:1;border:none;border-bottom:1px solid var(--line);background:transparent;font-family:inherit;font-size:14px;color:var(--ink);padding:5px 0;outline:none}
.wininput:focus{border-bottom-color:var(--ink)}
.grid{display:flex;flex-wrap:wrap;gap:4px;margin-top:15px;padding-top:14px;border-top:1px solid var(--hair)}
.dot{width:calc((100% - 36px)/10);aspect-ratio:1;border-radius:3px;background:var(--line)}
.dot.part{background:var(--part)}
.dot.full{background:var(--good2)}
.dot.perfect{background:var(--ink)}
.dot.miss{background:var(--miss)}
.dot.today{outline:1.5px solid var(--ink);outline-offset:1px}
.dot{cursor:pointer;padding:0;border:none}
.dot.sel{outline:2px solid var(--ink);outline-offset:1px}
.dayview{margin-top:14px;padding:13px;border-radius:14px;background:var(--surf3);border:1px solid var(--line)}
.dvhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.dvday{font-family:'Instrument Serif',Georgia,serif;font-size:20px;line-height:1.1}
.dvdate{font-size:11.5px;color:var(--ink3);margin-top:1px}
.dvright{text-align:right;flex-shrink:0}
.dvscore{font-family:'Instrument Serif',Georgia,serif;font-size:22px;line-height:1}
.dvscore span{font-size:13px;color:var(--ink4)}
.dvstate{font-size:9.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;margin-top:3px}
.dvstate.perfect{color:var(--ink)} .dvstate.win{color:var(--good)}
.dvstate.short{color:var(--warn)} .dvstate.none{color:var(--ink4)}
.dvcat{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink4);margin:11px 0 4px}
.dvrow{display:flex;align-items:center;gap:9px;padding:4px 0;font-size:13.5px;color:var(--ink4)}
.dvrow.on{color:var(--ink);font-weight:500}
.dvmark{width:14px;text-align:center;font-size:12px;color:var(--ink4)}
.dvrow.on .dvmark{color:var(--good);font-weight:700}
.dvemo{font-size:13px;width:18px;text-align:center}
.dvwin{font-size:13.5px;padding:4px 0;display:flex;gap:9px;align-items:baseline}
.dvempty{font-size:13px;color:var(--ink4);padding:8px 0}
.dvclose{margin-top:12px;width:100%;padding:9px;border-radius:10px;background:var(--surf);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink2)}
.chalfoot{display:flex;justify-content:space-between;align-items:center;margin-top:11px}

.uptxt{font-size:14px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.donehead{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink4);margin:26px 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div id="app">
  <div class="top">
    <h1>To-Do's</h1>
    <div class="topright">
      <button id="themebtn" aria-label="Toggle dark mode">&#9680;</button>
      <span class="count"><b id="total">0m</b><span id="left">0 left</span></span>
    </div>
  </div>
  <div class="evwrap">
    <div class="evhead">
      <span class="sechead" style="margin:0">Upcoming</span>
      <button class="evadd" id="evtoggle">+ Add date</button>
    </div>
    <div class="evform" id="evform">
      <input id="evname" placeholder="What is it?" autocomplete="off" />
      <input type="date" id="evdate" />
      <input type="date" id="evend" />
      <button id="evsave" disabled>Save</button>
    </div>
    <div id="evlist"></div>
  </div>
  <div class="todaywrap" id="todaywrap"></div>
  <div class="composer">
    <input id="tin" placeholder="Add or find a task" autocomplete="off" />
    <button id="plus" disabled aria-label="Add task">+</button>
  </div>
  <div id="sugg"></div>
  <div class="opts" id="opts"></div>
  <div id="chalwrap"></div>
  <div class="rouwrap" id="routinewrap"></div>
  <div id="c4cwrap"></div>
  <div id="list"></div>
</div>

<script>
var KEY = "todos-v3";
var TKEY = "theme-v1";
(function(){
  var t = "light";
  try { t = localStorage.getItem(TKEY) || "light"; } catch(e){}
  document.documentElement.setAttribute("data-theme", t);
})();
function currentTheme(){ return document.documentElement.getAttribute("data-theme") || "light"; }
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(TKEY, t); } catch(e){}
  var m = document.querySelector('meta[name="theme-color"]');
  if(m) m.setAttribute("content", t === "dark" ? "#141416" : "#FBFAF9");
  var b = document.getElementById("themebtn");
  if(b) b.textContent = t === "dark" ? "\u25D1" : "\u25D0";
}
var LEVELS = [
  { id:"high", label:"High",   mark:"\u25B2", pill:"var(--pill-hi-bg)", text:"var(--pill-hi-ink)" },
  { id:"med",  label:"Medium", mark:"\u25CF", pill:"var(--pill-md-bg)", text:"var(--pill-md-ink)" },
  { id:"low",  label:"Low",    mark:"\u25BC", pill:"var(--pill-lo-bg)", text:"var(--pill-lo-ink)" }
];
var TIMES = [15, 30, 60, 120, 240, 480];
var SLOTS = [
  { id:"any",       label:"Anytime",   emo:"\u25CB",             key:"any" },
  { id:"morning",   label:"Morning",   emo:"\uD83C\uDF05",      key:"am" },
  { id:"afternoon", label:"Afternoon", emo:"\u2600\uFE0F",      key:"pm" },
  { id:"evening",   label:"Evening",   emo:"\uD83C\uDF19",      key:"ev" }
];
var slot = "any";
var clockVal = "";
var editSlot = "any";
var editClock = "";

function fmtClock(v){
  if(!v) return "";
  var p = v.split(":"), h = +p[0], m = p[1];
  var ap = h >= 12 ? "PM" : "AM";
  h = h % 12; if(h === 0) h = 12;
  return h+":"+m+" "+ap;
}
var SLOT_ORDER = ["morning","afternoon","evening","any"];
function slotsInRenderOrder(){
  return SLOT_ORDER.map(function(id){ return slotOf(id); });
}
function slotVars(sl){
  var k = sl.key || "any";
  return "--slot-bg:var(--"+k+"-bg);--slot-ink:var(--"+k+"-ink);--slot-edge:var(--"+k+"-edge)";
}
function slotOf(id){ for(var i=0;i<SLOTS.length;i++) if(SLOTS[i].id===id) return SLOTS[i]; return SLOTS[0]; }
function byClock(a,b){
  if(a.clock && b.clock) return a.clock < b.clock ? -1 : a.clock > b.clock ? 1 : 0;
  if(a.clock) return -1;
  if(b.clock) return 1;
  return 0;
}

var REPEATS = [
  { id:"once",     label:"Once" },
  { id:"daily",    label:"Daily" },
  { id:"weekdays", label:"Weekdays" }
];
var repeat = "once";
var editRep = "once";

function todayStr(){
  var d = new Date();
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function isRecurring(t){ return t.repeat === "daily" || t.repeat === "weekdays"; }
function activeToday(t){
  if(t.repeat === "weekdays"){ var w = new Date().getDay(); return w >= 1 && w <= 5; }
  return true;
}
function isDone(t){ return isRecurring(t) ? t.doneOn === todayStr() : !!t.done; }
var ICONS = [
  [/bill|pay|invoice|rent/i,"\uD83D\uDCB8","#FEF3C7"],
  [/budget|money|finance|bank/i,"\uD83D\uDCB0","#FDE8D7"],
  [/doctor|appointment|dentist|health|clinic/i,"\uD83E\uDE7A","#DDF1F7"],
  [/resume|cv|cover letter/i,"\uD83D\uDCC4","#E7E4FA"],
  [/interview|screen|recruiter|apply/i,"\uD83C\uDFAF","#FCE0E4"],
  [/meeting|brainstorm|standup|sync/i,"\uD83E\uDDE0","#FBDDE6"],
  [/call|phone|mom|dad|ring/i,"\uD83D\uDCDE","#E3F5DE"],
  [/email|send|reply|follow.?up|outreach/i,"\u2709\uFE0F","#E4EEFB"],
  [/laundry|fold|clean|dishes|tidy/i,"\uD83E\uDDFA","#EAF0DC"],
  [/grocer|shop|store|buy|order/i,"\uD83D\uDED2","#FDE7DC"],
  [/gym|run|workout|walk|train/i,"\uD83C\uDFCB\uFE0F","#DFF0EC"],
  [/code|deploy|bug|build|app|ship/i,"\uD83D\uDCBB","#E5E7F5"],
  [/read|study|learn|course/i,"\uD83D\uDCD6","#F2E7DA"],
  [/car|drive|gas|oil/i,"\uD83D\uDE97","#E6ECF3"],
  [/gift|birthday|card/i,"\uD83C\uDF81","#FBE1EC"],
  [/trip|flight|travel|hotel/i,"\u2708\uFE0F","#DEEDF7"],
  [/water|plant|garden/i,"\uD83E\uDEB4","#E2F1DC"],
  [/eat|lunch|dinner|cook|meal/i,"\uD83C\uDF7D\uFE0F","#FBE9D8"],
  [/write|draft|post|note/i,"\u270D\uFE0F","#EDE6F7"],
  [/pack|move|box/i,"\uD83D\uDCE6","#F0E9DE"]
];

var EKEY = "events-v1";
var events = [];
var tasks = [];
var level = "high";
var minutes = 30;
var collapsed = {};
var editing = null, editText = "", editLevel = "high", editMin = 30;
var editingEv = null, evText = "", evDate = "", evEnd = "";

try { tasks = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { tasks = []; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch(e){} }
try { events = JSON.parse(localStorage.getItem(EKEY)) || []; } catch (e) { events = []; }
function saveEvents(){ try { localStorage.setItem(EKEY, JSON.stringify(events)); } catch(e){} }

function countdownEv(e){
  var ds = dayDiff(e.due), de = dayDiff(endOf(e));
  if(ds <= 0 && de >= 0 && isMulti(e)){
    var n = spanDays(e) - de;
    return { t:"Day "+n+" of "+spanDays(e), soon:true, now:true };
  }
  return countdown(e.due);
}
function countdown(due){
  var d = dayDiff(due);
  if(d === 0) return { t:"Today", soon:true };
  if(d === 1) return { t:"Tomorrow", soon:true };
  if(d < 0)   return { t:"Passed", soon:false };
  if(d < 7)   return { t:"in "+d+" days", soon:true };
  if(d < 14)  return { t:"next week", soon:false };
  return { t:"in "+d+" days", soon:false };
}

function endOf(e){ return e.end || e.due; }
function spanDays(e){ return dayDiff(endOf(e)) - dayDiff(e.due) + 1; }
function isMulti(e){ return e.end && e.end !== e.due; }
function rangeText(e){
  var p1 = e.due.split("-"), p2 = endOf(e).split("-");
  var a = new Date(+p1[0], +p1[1]-1, +p1[2]), b = new Date(+p2[0], +p2[1]-1, +p2[2]);
  var sameMonth = p1[1] === p2[1] && p1[0] === p2[0];
  var A = a.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  var B = sameMonth ? b.getDate() : b.toLocaleDateString(undefined,{month:"short",day:"numeric"});
  return A+" \u2013 "+B+" \u00B7 "+spanDays(e)+" days";
}

function renderEvents(){
  var live = events
    .filter(function(e){ return dayDiff(endOf(e)) >= 0; })
    .sort(function(a,b){ return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });

  if(!live.length){
    document.getElementById("evlist").innerHTML =
      '<div class="evempty">No dates yet \u2014 concerts, appointments, deadlines, trips.</div>';
    return;
  }

  var shown = evExpanded ? live : live.slice(0, EV_PREVIEW);
  var hidden = live.length - shown.length;

  var html = '<div class="evlist">';
  shown.forEach(function(e){
    var p = e.due.split("-");
    var dt = new Date(+p[0], +p[1]-1, +p[2]);
    var c = countdownEv(e);
    if(editingEv === e.id){
      html += '<div class="evrow" style="display:block"><input class="einput" id="eEvName" value="'+esc(evText)+'" />'+
        '<input class="einput" type="date" id="eEvDate" value="'+evDate+'" />'+
        '<input class="einput" type="date" id="eEvEnd" value="'+(evEnd||"")+'" />'+
        '<div class="eacts"><button class="ebtn cancel" data-act="evcancel">Cancel</button>'+
        '<button class="ebtn save" data-act="evsave2" data-id="'+e.id+'">Save</button></div></div>';
      return;
    }
    html += '<div class="evrow">'+
      '<span class="evdate"><span class="evmon">'+dt.toLocaleDateString(undefined,{month:"short"})+'</span>'+
      '<span class="evday'+(isMulti(e)?" rng":"")+'">'+
        (isMulti(e) ? dt.getDate()+"\u2013"+(+endOf(e).split("-")[2]) : dt.getDate())+'</span></span>'+
      '<span class="evmid"><span class="evname" data-act="evedit" data-id="'+e.id+'">'+esc(e.name)+'</span>'+
      '<span class="evcount'+(c.soon?" soon":"")+'">'+c.t+
        (c.now ? '<span class="evnow">now</span>' : '')+'</span>'+
      (isMulti(e) ? '<span class="evrange">'+rangeText(e)+'</span>' : '')+'</span>'+
      '<button class="evdel" data-act="evdel" data-id="'+e.id+'" aria-label="Delete date">\u00D7</button></div>';
  });
  if(hidden > 0){
    html += '<button class="evmore" data-act="evmore">+ '+hidden+' more</button>';
  } else if(evExpanded && live.length > EV_PREVIEW){
    html += '<button class="evmore" data-act="evmore">show less</button>';
  }
  document.getElementById("evlist").innerHTML = html + '</div>';
}

function fmt(m){ if(m<60) return m+"m"; var h=Math.floor(m/60), r=m%60; return r? h+"h "+r+"m" : h+"h"; }
function iconFor(t){ for(var i=0;i<ICONS.length;i++){ if(ICONS[i][0].test(t)) return {e:ICONS[i][1],bg:ICONS[i][2]}; } return {e:"\uD83D\uDCCC",bg:"#EEEDEA"}; }
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function dayDiff(due){
  var p = due.split("-");
  var a = new Date(+p[0], +p[1]-1, +p[2]);
  var n = new Date();
  return Math.round((a - new Date(n.getFullYear(), n.getMonth(), n.getDate())) / 86400000);
}
function dateLabel(due){
  var d = dayDiff(due);
  var p = due.split("-");
  var dt = new Date(+p[0], +p[1]-1, +p[2]);
  if(d < 0)  return { t: (-d===1? "1 day late" : (-d)+" days late"), hot:true };
  if(d === 0) return { t:"Today", hot:true };
  if(d === 1) return { t:"Tomorrow", hot:true };
  if(d < 7)  return { t: dt.toLocaleDateString(undefined,{weekday:"long"}), hot:false };
  return { t: dt.toLocaleDateString(undefined,{month:"short",day:"numeric"}), hot:false };
}
function levelById(id){ for(var i=0;i<LEVELS.length;i++) if(LEVELS[i].id===id) return LEVELS[i]; return LEVELS[0]; }

function rowHTML(t, showPri, hideProj){
  if(editing === t.id){
    var EL = levelById(editLevel), ES = slotOf(editSlot), ER = null;
    for(var ri=0; ri<REPEATS.length; ri++) if(REPEATS[ri].id===editRep) ER = REPEATS[ri];
    var opts = '<div class="opts show">';
    if(editRep === "once"){
      opts += '<button class="opt pri set" data-act="ecyc" data-f="lvl" style="background:'+EL.pill+';color:'+EL.text+'">'+
              '<span class="m">'+EL.mark+'</span>'+EL.label+'</button>';
    }
    opts += '<button class="opt set" data-act="ecyc" data-f="min">\u23F1 '+fmt(editMin)+'</button>'+
            '<button class="opt'+(editRep!=="once"?" set":"")+'" data-act="ecyc" data-f="rep">'+
            (editRep==="once" ? '<span class="k">repeat</span>once' : '\u21BB '+ER.label)+'</button>'+
            '<button class="opt set" data-act="ecyc" data-f="slot">'+ES.emo+' '+ES.label+'</button>'+
            '<button class="opt'+(editProj?" set proj-on":"")+'" data-act="ecyc" data-f="proj">'+
              (editProj ? "\u25C6 C4C" : '<span class="k">project</span>\u2014')+'</button>'+
            '<input type="time" id="eClock" class="optclock" value="'+(editClock||"")+'" />'+
            '</div>';

    return '<div class="editbox">'+
      '<input class="einput" id="eIn" value="'+esc(editText)+'" />'+
      opts+
      '<div class="eacts"><button class="ebtn del" data-act="del" data-id="'+t.id+'">Delete</button>'+
      '<button class="ebtn cancel" data-act="ecancel">Cancel</button>'+
      '<button class="ebtn save" data-act="esave" data-id="'+t.id+'">Save</button></div></div>';
  }
  var ic = iconFor(t.text);
  var dn = isDone(t);
  var d = (dn ? " done" : "") + ((t.today || isRecurring(t)) && !dn ? " today" : "");
  return '<div class="item'+d+'" id="task-'+t.id+'">'+
    '<span class="bubble" style="--b:'+(dn?"var(--surf2)":ic.bg)+'">'+ic.e+'</span>'+
    '<div class="mid"><div class="txt" data-act="edit" data-id="'+t.id+'">'+esc(t.text)+'</div>'+
    '<div class="metarow"><button class="time" data-act="time" data-id="'+t.id+'">\u23F1 '+fmt(t.minutes||30)+'</button>'+
    (showPri && !isRecurring(t) ? (function(){ var L=levelById(t.level);
      return '<span class="pbadge" style="background:'+L.pill+';color:'+L.text+'"><span class="m">'+L.mark+'</span>'+L.label+'</span>'; })() : '')+
    (t.proj === "c4c" && !hideProj ? '<span class="pjbadge">C4C</span>' : '')+
    (t.clock ? '<span class="clock">'+fmtClock(t.clock)+'</span>' : '')+
    (isRecurring(t) ? '<span class="rbadge">\u21BB '+(t.repeat==="daily"?"daily":"weekdays")+'</span>' :
      (dn ? '' : '<button class="tbtn'+(t.today?" on":"")+'" data-act="today" data-id="'+t.id+'">'+(t.today?"\u2713 today":"+ today")+'</button>'))+
    '</div></div>'+
    '<button class="del" data-act="del" data-id="'+t.id+'" aria-label="Delete task">\u00D7</button>'+
    '<button class="circle'+(dn?" on":"")+'" data-act="toggle" data-id="'+t.id+'" aria-label="Toggle done">'+(dn?"\u2713":"")+'</button>'+
  '</div>';
}

function render(){
  var visible = tasks.filter(activeToday);
  var openT = visible.filter(function(t){ return !isDone(t); });
  var doneT = visible.filter(function(t){ return isDone(t) && !isRecurring(t); });
  var total = openT.reduce(function(s,t){ return s + (t.minutes||0); }, 0);
  document.getElementById("total").textContent = fmt(total);
  document.getElementById("left").textContent = openT.length + " left";

  var rankOf = { high:0, med:1, low:2 };
  var todayT = openT.filter(function(t){ return t.today && !isRecurring(t); })
                    .sort(function(a,b){ return rankOf[a.level] - rankOf[b.level]; });
  var restT = openT.filter(function(t){ return !t.today && !isRecurring(t) && t.proj !== "c4c"; });
  var c4cT  = openT.filter(function(t){ return !t.today && !isRecurring(t) && t.proj === "c4c"; });
  var todayMin = todayT.reduce(function(s,t){ return s + (t.minutes||0); }, 0);

  // ---- routine: recurring items, grouped by part of day ----
  var rou = visible.filter(isRecurring);
  var rouDone = rou.filter(isDone).length;
  var rhtml = "";
  if(rou.length){
    rhtml = '<div class="rouhead">\u21BB Routine <span class="tot">'+rouDone+'/'+rou.length+' done</span></div>';
    var rGroups = slotsInRenderOrder().map(function(sl){
      return { sl: sl, g: rou.filter(function(t){ return (t.slot||"any") === sl.id; }).sort(byClock) };
    }).filter(function(x){ return x.g.length; });
    rGroups.forEach(function(x){
      var rk = "rou:"+x.sl.id;
      var rsolo = (rGroups.length === 1 && x.sl.id === "any");
      var ropen = rsolo || slotOpen(rk) || !!query;
      rhtml += '<div class="slot">';
      if(!rsolo){
        rhtml += '<button class="slothead" data-act="slotfold" data-k="'+rk+'" style="'+slotVars(x.sl)+'">'+
          '<span class="slotemo">'+x.sl.emo+'</span>'+
          '<span class="slotname">'+x.sl.label+'</span>'+
          '<span class="slotmeta">'+x.g.filter(isDone).length+'/'+x.g.length+'</span>'+
          '<span class="chev'+(ropen?" up":"")+'">\u25BE</span></button>';
      }
      if(ropen) x.g.forEach(function(t){ rhtml += rowHTML(t); });
      rhtml += '</div>';
    });
  } else {
    rhtml = '<div class="rouhead">\u21BB Routine</div>'+
      '<div class="rouempty">Add anything you do every day \u2014 pills, protein shake, feeding the dog \u2014 and set it to <b>Daily</b>. It lives here, not in your task list.</div>';
  }
  document.getElementById("routinewrap").innerHTML = rhtml;

  var thtml = "";
  if(todayT.length){
    thtml = '<div class="thead">Today ('+todayT.length+')<span class="tot">\u00B7 '+fmt(todayMin)+'</span></div>'+
      '<div class="tcap">What you committed to \u2014 tap <b>+ today</b> on anything below to add.</div>';
    var tGroups = slotsInRenderOrder().map(function(sl){
      return { sl: sl, g: todayT.filter(function(t){ return (t.slot||"any") === sl.id && matches(t); })
                 .sort(function(a,b){
                   var c = byClock(a,b);
                   if(c !== 0) return c;
                   var r = { high:0, med:1, low:2 };
                   var ra = (a.level in r) ? r[a.level] : 1;
                   var rb = (b.level in r) ? r[b.level] : 1;
                   return ra - rb;
                 }) };
    }).filter(function(x){ return x.g.length; });
    tGroups.forEach(function(x){
      var gm = x.g.reduce(function(a,t){ return a + (t.minutes||0); }, 0);
      var tk = "today:"+x.sl.id;
      var solo = (tGroups.length === 1 && x.sl.id === "any");
      var topen = solo || slotOpen(tk) || !!query;

      thtml += '</div>';
    });
  } else if(openT.length){
    thtml = '<div class="thead">Today (0)</div><div class="tempty">Action items you commit to today land here. Tap <b>+ today</b> on anything below.</div>';
  }
  document.getElementById("todaywrap").innerHTML = thtml;

  // ---- C4C project section ----
  var cShown = c4cT.filter(matches);
  var cAll = tasks.filter(function(t){ return t.proj === "c4c"; });
  var cDone = cAll.filter(function(t){ return isDone(t); }).length;
  var cMin = cShown.reduce(function(a,t){ return a + (t.minutes||0); }, 0);
  var chtml = "";
  if(cAll.length || c4cOpen){
    chtml = '<div class="c4c"><button class="c4chead" data-act="c4cfold">'+
      '<span class="c4cdot"></span><span class="c4cname">C4C</span>'+
      '<span class="c4cmeta">'+cShown.length+(cShown.length?' \u00B7 '+fmt(cMin):'')+
      (cDone?' \u00B7 '+cDone+' done':'')+'</span>'+
      '<span class="chev'+(c4cOpen?" up":"")+'">\u25BE</span></button>';
    if(c4cOpen){
      chtml += '<div class="c4cbody">';
      if(cShown.length){
        var rank = { high:0, med:1, low:2 };
        cShown.sort(function(a,b){
          var ra = (a.level in rank) ? rank[a.level] : 1;
          var rb = (b.level in rank) ? rank[b.level] : 1;
          return ra - rb;
        }).forEach(function(t){ chtml += rowHTML(t, true, true); });
      } else {
        chtml += '<div class="c4cempty">'+(query ? 'No C4C tasks match \u201C'+esc(query)+'\u201D.' : 'Nothing here yet \u2014 add a C4C task below.')+'</div>';
      }
      chtml += '<div class="c4cadd"><input id="c4cin" placeholder="Add a C4C task" autocomplete="off" />'+
        '<button id="c4cplus" data-act="c4cadd" aria-label="Add C4C task">+</button></div></div>';
    }
    chtml += '</div>';
  }
  document.getElementById("c4cwrap").innerHTML = chtml;

  var html = "";
  if(!tasks.length){
    html = '<div class="empty"><div class="big">Nothing here yet</div><div>Add what matters most first.</div></div>';
  }
  LEVELS.forEach(function(l){
    var g = restT.filter(function(t){ return t.level===l.id && matches(t); });
    if(!g.length) return;
    var isOpen = !collapsed[l.id];
    var gm = g.reduce(function(s,t){ return s+(t.minutes||0); },0);
    html += '<div class="group"><button class="ghead" data-act="fold" data-lvl="'+l.id+'" style="background:'+l.pill+';color:'+l.text+'">'+
      '<span class="m">'+l.mark+'</span>'+l.label+' ('+g.length+')<span class="tot">\u00B7 '+fmt(gm)+'</span>'+
      '<span class="chev'+(isOpen?" up":"")+'">\u25BE</span></button>';
    if(isOpen) g.forEach(function(t){ html += rowHTML(t); });
    html += '</div>';
  });
  var dShown = doneT.filter(matches);
  if(dShown.length){
    html += '<div class="donehead">Done ('+dShown.length+')</div>';
    dShown.forEach(function(t){ html += rowHTML(t); });
  }
  if(query && !dShown.length && !restT.filter(matches).length && !cShown.length){
    html += '<div class="empty"><div class="big">No matches</div><div>Nothing contains \u201C'+esc(query)+'\u201D.</div></div>';
  }
  document.getElementById("list").innerHTML = html;
}

function habitsIn(cat){ return HABITS.filter(function(h){ return h.cat === cat; }); }
function catDone(ds, cat){
  var e = entry(ds), n = 0;
  habitsIn(cat).forEach(function(h){ if(e[h.id]) n++; });
  return n;
}
function catMet(ds, c){
  var have = catDone(ds, c.id);
  if(c.need === "all") return have === habitsIn(c.id).length;
  return have >= c.need;
}

function backfillDays(days){
  var applied = 0;
  days.forEach(function(n){
    if(!(n >= 1 && n <= DAYS)) return;
    var ds = dateForIndex(n - 1);
    if(dayDiff(ds) > 0) return;                  // never a future day
    var e = chal.log[ds] || {};
    HABITS.forEach(function(h){ e[h.id] = true; });
    e.of = HABITS.length;
    chal.log[ds] = e;
    applied++;
  });
  if(applied) saveChal();
  return applied;
}

// One-time backfill, only via URL: ?backfill=1,2,3,4  (day numbers, 1-based).
// Deliberately not a button — correcting the record should take effort.
(function(){
  var m = (location.search || "").match(/[?&]backfill=([0-9,]+)/);
  if(!m) return;
  backfillDays(m[1].split(",").map(Number));
  if(history && history.replaceState) history.replaceState(null, "", location.pathname);
})();

function dayIndex(){ return -dayDiff(chal.start); }        // 0-based days since start
function dateForIndex(i){
  var p = chal.start.split("-");
  var d = new Date(+p[0], +p[1]-1, +p[2] + i);
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function entry(ds){ return chal.log[ds] || {}; }
function scoreFor(ds){
  var e = entry(ds), n = 0;
  HABITS.forEach(function(h){ if(e[h.id]) n++; });
  return n;
}
function targetFor(ds){ return entry(ds).of || HABITS.length; }
function isFullDay(ds){
  for(var i=0;i<CATS.length;i++){
    if(CATS[i].need === 0) continue;
    if(!catMet(ds, CATS[i])) return false;
  }
  return true;
}
function winTarget(){
  var n = 0;
  CATS.forEach(function(c){
    if(c.need === "all") n += habitsIn(c.id).length;
    else if(typeof c.need === "number") n += c.need;
  });
  return n;
}
function isPerfectDay(ds){ return scoreFor(ds) >= targetFor(ds); }
function streak(){
  var n = 0, i = dayIndex();
  for(; i >= 0; i--){
    if(isFullDay(dateForIndex(i))) n++;
    else if(i !== dayIndex()) break;
    else continue;                                          // today still in progress
  }
  return n;
}

function cycle(arr, cur){
  var i = arr.indexOf(cur);
  return arr[(i + 1) % arr.length];
}

    return;
  }

    (hits.length===1?' match':' matches')+'</div>';

function hilite(txt){
  var i = txt.toLowerCase().indexOf(query);
  if(i === -1) return esc(txt);

}

  if(act==="chalday"){

    window.__tapT = now;
    window.__tapN = (window.__tapN || 0) + 1;
    if(window.__tapN >= 3){
      window.__tapN = 0;
      var ans = prompt("Backfill days you completed but didn't log.\nEnter day numbers, e.g. 1,2,3,4\n\nThis is the only way back \u2014 use it once.");
      if(ans){
        var n = backfillDays(ans.split(",").map(function(x){ return parseInt(x.trim(),10); }));
        renderChal();
        alert(n ? (n+" day"+(n===1?"":"s")+" marked complete.") : "Nothing changed.");
      }
    }
    return;
  }
  if(act==="jump"){
    var t9 = tasks.filter(function(x){ return x.id===id; })[0];
    if(t9){
      // make sure nothing is collapsed around it
      if(isRecurring(t9))      slotFold["rou:"+(t9.slot||"any")] = true;
      else if(t9.today)        slotFold["today:"+(t9.slot||"any")] = true;
      else if(t9.proj==="c4c") c4cOpen = true;
      else                     collapsed[t9.level] = false;
      saveSlotFolds(); saveFolds();
    }
    query = ""; tin.value = ""; plus.disabled = true;
    renderOpts(); renderSugg(); render();
    setTimeout(function(){
      var el = document.getElementById("task-"+id);
      if(el){
        el.scrollIntoView({ behavior:"smooth", block:"center" });
        el.classList.add("flash");
        setTimeout(function(){ el.classList.remove("flash"); }, 1600);
      }
    }, 60);
    tin.blur();

  }
  if(act==="slotfold"){ toggleSlot(b.getAttribute("data-k")); render(); return; }
  if(act==="c4cfold"){ c4cOpen = !c4cOpen; render(); return; }
  if(act==="c4cadd"){
    var ci3 = document.getElementById("c4cin");
    var v3 = ci3 ? ci3.value.trim() : "";
    if(v3){
      tasks.push({ id: Date.now(), text: v3, level: "med", minutes: 30,
                   repeat: "once", slot: "any", clock: null, proj: "c4c",
                   doneOn: null, done: false });
      save(); render();
      var again = document.getElementById("c4cin");
      if(again) again.focus();

    return;

  if(act==="dayview"){
    var di = Number(b.getAttribute("data-i"));
    dayView = (dayView === di) ? null : di;
    renderChal();
    return;
  }
  if(act==="dayclose"){ dayView = null; renderChal(); return; }
  if(act==="chalfold"){ chalOpen = !chalOpen; renderChal(); return; }
  if(act==="winsopen"){ winsOpen = !winsOpen; renderChal(); return; }
  if(act==="hab"){
    var hid = b.getAttribute("data-h");

    chal.log[ds].of = HABITS.length;
    chal.log[ds][hid] = !chal.log[ds][hid];
    saveChal(); renderChal(); return;

  if(act==="chalreset"){
    if(confirm("Restart the 60-day challenge from today? Your logged history will be cleared.")){
      chal = { start: todayStr(), log:{} };
      dayView = null; winsOpen = false;
      saveChal(); renderChal();
    }
    return;
  }
  if(act==="today"){
    tasks.forEach(function(t){ if(t.id===id) t.today = !t.today; });
    save(); render(); return;
  }
  if(act==="edit"){
    var t0 = tasks.filter(function(t){ return t.id===id; })[0];
    if(t0){ editing=id; editText=t0.text; editLevel=t0.level; editMin=t0.minutes||30;
        editRep=t0.repeat||"once"; editSlot=t0.slot||"any"; editClock=t0.clock||"";
        editProj=t0.proj||""; render(); }
    return;
  }
  if(act==="ecyc"){
    grabEdit();
    var ef = b.getAttribute("data-f");
    if(ef==="lvl")  editLevel = cycle(LEVELS.map(function(x){return x.id;}), editLevel);
    if(ef==="min")  editMin   = cycle(TIMES, editMin);
    if(ef==="rep")  editRep   = cycle(REPEATS.map(function(x){return x.id;}), editRep);
    if(ef==="slot") editSlot  = cycle(SLOTS.map(function(x){return x.id;}), editSlot);
    if(ef==="proj") editProj  = cycle(PROJS.map(function(x){return x.id;}), editProj);
    render(); return;
  }
  if(act==="ecancel"){ editing=null; render(); return; }
  if(act==="esave"){
    grabEdit();
    var v = editText.trim();
    if(v){ tasks.forEach(function(t){
      if(t.id===id){
        t.text=v; t.level=editLevel; t.minutes=editMin;
        t.slot=editSlot; t.clock=editClock||null; t.proj=editProj||null;
        if(t.repeat !== editRep){ t.repeat = editRep; t.doneOn = null; t.done = false; }
      }
    }); save(); }
    editing=null; render(); return;
  }
  if(act==="evedit"){
    var e0 = events.filter(function(x){ return x.id===id; })[0];
    if(e0){ editingEv=id; evText=e0.name; evDate=e0.due; evEnd=e0.end||""; renderEvents(); }
    return;
  }
  if(act==="evmore"){ evExpanded = !evExpanded; renderEvents(); return; }
  if(act==="evcancel"){ editingEv=null; renderEvents(); return; }
  if(act==="evsave2"){
    var n = document.getElementById("eEvName"), d = document.getElementById("eEvDate"),
        en = document.getElementById("eEvEnd");
    if(n && n.value.trim() && d && d.value){
      var ev2 = (en && en.value && en.value > d.value) ? en.value : null;
      events.forEach(function(x){ if(x.id===id){ x.name=n.value.trim(); x.due=d.value; x.end=ev2; } });
      saveEvents();
    }
    editingEv=null; renderEvents(); return;
  }
  if(act==="toggle"){
    tasks.forEach(function(t){
      if(t.id!==id) return;
      if(isRecurring(t)) t.doneOn = (t.doneOn === todayStr()) ? null : todayStr();
      else t.done = !t.done;
    });
    save(); render();
  }
  else if(act==="del"){ tasks = tasks.filter(function(t){ return t.id!==id; }); save(); render(); }
  else if(act==="time"){ tasks.forEach(function(t){ if(t.id===id){ var i=TIMES.indexOf(t.minutes); t.minutes=TIMES[(i+1)%TIMES.length]; } }); save(); render(); }
  else if(act==="evdel"){ events = events.filter(function(e){ return e.id!==id; }); saveEvents(); renderEvents(); }
  else if(act==="fold"){ var l=b.getAttribute("data-lvl"); collapsed[l]=!collapsed[l]; saveFolds(); render(); }
  else if(act==="cyc"){
    var ci2 = document.getElementById("clockin");
    if(ci2) clockVal = ci2.value;
    var f = b.getAttribute("data-f");
    if(f==="lvl")  level   = cycle(LEVELS.map(function(x){return x.id;}), level);
    if(f==="min")  minutes = cycle(TIMES, minutes);
    if(f==="rep")  repeat  = cycle(REPEATS.map(function(x){return x.id;}), repeat);
    if(f==="slot") slot    = cycle(SLOTS.map(function(x){return x.id;}), slot);
    if(f==="proj") proj    = cycle(PROJS.map(function(x){return x.id;}), proj);
    renderOpts();
  }
  else if(act==="clockon"){ clockOpen = true; renderOpts();
    var c = document.getElementById("clockin");
    if(c){ c.focus(); if(c.showPicker) try { c.showPicker(); } catch(e){} }
  }
});

var evname = document.getElementById("evname");
var evdate = document.getElementById("evdate");
var evsave = document.getElementById("evsave");

document.getElementById("evtoggle").addEventListener("click", function(){
  var f = document.getElementById("evform");
  var open = f.classList.toggle("open");
  this.textContent = open ? "Cancel" : "+ Add date";
  if(open) evname.focus();
});
function evCheck(){ evsave.disabled = !(evname.value.trim() && evdate.value); }
evname.addEventListener("input", evCheck);
evdate.addEventListener("change", evCheck);
evname.addEventListener("keydown", function(e){ if(e.key==="Enter" && !evsave.disabled) evsave.click(); });

evsave.addEventListener("click", function(){
  var ee = document.getElementById("evend");
  var endV = (ee && ee.value && ee.value > evdate.value) ? ee.value : null;
  events.push({ id: Date.now(), name: evname.value.trim(), due: evdate.value, end: endV });
  evname.value = ""; evdate.value = ""; if(ee) ee.value = ""; evsave.disabled = true;
  document.getElementById("evform").classList.remove("open");
  document.getElementById("evtoggle").textContent = "+ Add date";
  saveEvents(); renderEvents();
});

document.getElementById("app").addEventListener("keydown", function(ev){
  if(ev.target && ev.target.id === "c4cin" && ev.key === "Enter"){
    ev.preventDefault();
    var btn = document.getElementById("c4cplus");
    if(btn) btn.click();
  }
});

document.getElementById("app").addEventListener("input", function(ev){
  var el = ev.target;
  if(!el || !el.classList || !el.classList.contains("wininput")) return;
  var ds = todayStr();
  if(!chal.log[ds]) chal.log[ds] = {};
  var list = chal.log[ds].winsList || ["","","","",""];
  list[Number(el.getAttribute("data-win"))] = el.value;
  chal.log[ds].winsList = list;
  var filled = list.filter(function(x){ return x && x.trim(); }).length;
  chal.log[ds].wins = filled >= 5;
  saveChal();
});

// Installed web apps resume rather than reload — re-render when the day rolls over
// or whenever the app comes back to the foreground.
var lastRenderedDay = todayStr();
function refreshAll(){
  renderChal();
  renderEvents();
  render();
}
function checkDayRollover(){
  var now = todayStr();
  if(now !== lastRenderedDay){
    lastRenderedDay = now;
    winsOpen = false;
  }
  refreshAll();
}
document.addEventListener("visibilitychange", function(){
  if(!document.hidden) checkDayRollover();
});
window.addEventListener("focus", checkDayRollover);
window.addEventListener("pageshow", checkDayRollover);
setInterval(checkDayRollover, 60000);

applyTheme(currentTheme());
document.getElementById("themebtn").addEventListener("click", function(){
  applyTheme(currentTheme() === "dark" ? "light" : "dark");
});

renderChal();
renderOpts();
renderSugg();
renderEvents();
render();
</script>
